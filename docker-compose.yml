# Optional local stack (the primary workflow runs without Docker). The database stays on Neon.
name: blockauth

services:
  hardhat:
    build: ./contracts
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    # Published on this machine only. The node's accounts are public test keys, and account #0 is the
    # contract admin: anyone who can reach port 8545 can change the registry.
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='Content-Type: application/json' --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env.local
    environment:
      BLOCKCHAIN_RPC_URL: http://hardhat:8545
      APP_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      # Every request arrives from nginx. Rate limits and the failed-sign-in block count per client, so
      # the backend takes the client address from nginx's X-Forwarded-For, and only from nginx.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXIES: 172.29.53.10/32
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      hardhat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    networks:
      default:
        # Fixed, so that the backend can trust exactly this address (TRUSTED_PROXIES above).
        ipv4_address: 172.29.53.10
    depends_on:
      backend:
        condition: service_healthy

  # Optional shared state for several backend instances: docker compose --profile redis ... (see
  # docker-compose.redis.yml). Published on this machine only, on 6380 (6379 is often taken), and
  # password-protected: REDIS_PASSWORD must be set in the shell or in .env.local.
  redis:
    image: redis:7.4-alpine
    profiles: ["redis"]
    # Refuses to start without a password (checked in the container, so the default stack never needs one).
    command: ["sh", "-c", "[ -n \"$$REDIS_PASSWORD\" ] || { echo 'set REDIS_PASSWORD' >&2; exit 1; }; exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  # Optional mail catcher for the e-mail alerts in development: docker compose --profile mail up.
  # SMTP on 127.0.0.1:1025, web inbox on http://127.0.0.1:8025. Never use it for real mail.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.53.0/24
