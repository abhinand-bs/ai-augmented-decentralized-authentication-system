name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No secrets are used anywhere: the workflow runs the same on forks. CI never touches Neon or a public chain;
# databases, Redis and the chain are throwaway containers or processes of this run.
env:
  TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/blockauth_ci
  TEST_DB_USERNAME: postgres
  TEST_DB_PASSWORD: ci-only-password

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Tests (unit, refusal paths, contract guardian, fast-check model)
        run: npx hardhat test
      - name: Coverage
        run: npx hardhat coverage
        env:
          FC_RUNS: "20"
      - name: Production dependency audit
        run: npm audit --omit=dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Slither (fails on Medium and above, see slither.config.json)
        run: |
          pip install slither-analyzer==0.11.6 solc-select
          slither . --config-file slither.config.json --fail-medium
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-coverage
          path: contracts/coverage/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blockauth_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests on PostgreSQL 16
        run: chmod +x mvnw && ./mvnw -B verify
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  backend-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start a Hardhat node and deploy
        working-directory: contracts
        run: |
          npm ci
          npx hardhat node > hardhat.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' http://127.0.0.1:8545 && break
            sleep 1
          done
          npx hardhat run scripts/deploy.js --network localhost
          # Account #0 of the public Hardhat test mnemonic: derived here, never stored in the repository.
          KEY=$(node -e "const {HDNodeWallet,Mnemonic}=require('ethers');console.log(HDNodeWallet.fromMnemonic(Mnemonic.fromPhrase('test test test test test test test test test test test junk'),\"m/44'/60'/0'/0/0\").privateKey)")
          echo "::add-mask::$KEY"
          echo "BLOCKCHAIN_OPERATOR_PRIVATE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "CONTRACT_ADDRESS=$(node -p "require('./deployments/localhost.json').address")" >> "$GITHUB_ENV"
      - name: Chain integration tests (real contract)
        working-directory: backend
        env:
          BLOCKCHAIN_RPC_URL: http://127.0.0.1:8545
          BLOCKCHAIN_CHAIN_ID: "31337"
        run: >-
          chmod +x mvnw && ./mvnw -B verify -Pblockchain-it -Dit.test=WalletRegistryClientIT
          -Dtest=Eip1559TransactionTest,WalletRegistryClientLockTest -Dsurefire.failIfNoSpecifiedTests=false

  backend-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: blockauth_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_PASSWORD: ci-only-redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Password-protected Redis
        run: docker run -d -p 127.0.0.1:6380:6379 redis:7.4-alpine redis-server --requirepass "$REDIS_PASSWORD"
      - name: Redis tests (two instances, leases)
        working-directory: backend
        run: >-
          chmod +x mvnw && ./mvnw -B verify -Dit.test='RedisMultiInstanceIT,RedisLeasesIT' -Dit.excludedGroups=
          -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: No web3 library in the production bundle
        run: npm run check:bundle
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (UI layer, mocked API)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            frontend/playwright-report/
            frontend/test-results/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files are valid for every profile
        run: |
          touch .env.local
          docker compose config --quiet
          docker compose --profile mail config --quiet
          REDIS_PASSWORD=ci docker compose --profile redis config --quiet
          REDIS_PASSWORD=ci docker compose --profile redis -f docker-compose.yml -f docker-compose.redis.yml config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all images
        run: docker compose build
